[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música (tool calling + MCP)"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40",
  "mcp>=1.9,<2",
  "holidays>=0.50",
  "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
emporio-chat = "emporio.cli:main"
emporio-mcp = "emporio.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
